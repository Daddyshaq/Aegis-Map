<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline — Aegis Map</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        text-align: center;
      }
      .card {
        max-width: 28rem;
      }
      svg {
        width: 64px;
        height: 64px;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        background: #2563eb;
        color: #fff;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <path
          d="M256 80c48 28 96 40 140 40 0 132-52 236-140 272-88-36-140-140-140-272 44 0 92-12 140-40Z"
          fill="#2563eb"
          stroke="#93c5fd"
          stroke-width="14"
          stroke-linejoin="round"
        />
      </svg>
      <h1>You're offline</h1>
      <p>
        Aegis Map can't reach the network right now. Any crisis data you viewed recently is still
        cached. Reconnect to load the live map, submit reports, and receive alerts.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
