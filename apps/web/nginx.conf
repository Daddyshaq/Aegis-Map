# nginx config for the Aegis Map SPA + PWA.
# Listens on 8080 so the container can run as an unprivileged user.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip common text assets. (Precompressed/brotli can be layered on later.)
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/manifest+json
    image/svg+xml;

  # Security headers. The CSP is intentionally permissive about connect-src
  # because the app talks to Supabase, the API, tile, geocoding and routing
  # hosts that vary per deployment; tighten per environment as needed.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self)" always;

  # The service worker must never be cached, or clients get stuck on an old SW.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # The web app manifest and entry document: always revalidate.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Fingerprinted build assets are immutable — cache them hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA history-API fallback: unknown paths render the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
